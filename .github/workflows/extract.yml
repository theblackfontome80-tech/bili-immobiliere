{"name":"Extract site","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"extract":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"ls *.zip >/dev/null 2>&1 || exit 0; set -e; mkdir -p /tmp/x; unzip -q -o *.zip -d /tmp/x || true; chmod -R u+rwX,go+rX /tmp/x; d=$(dirname \"$(find /tmp/x -name server.js | head -1)\"); test -f \"$d/server.js\"; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com; git checkout -q --orphan site; git rm -rfq .; cp -r \"$d\"/. .; git add -A; git commit -qm 'Site extrait du zip'; git push -f origin site"}]}}}
