{"name":"Extract site","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"extract":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"ls *.zip >/dev/null 2>&1 || exit 0; set -e; for z in *.zip; do mkdir -p \"/tmp/x/$z\"; unzip -q -o \"$z\" -d \"/tmp/x/$z\" || true; done; chmod -R u+rwX,go+rX /tmp/x; si=$(find /tmp/x -path '*/public/index.html' | head -1); s=$(dirname \"$(dirname \"$si\")\"); bi=$(find /tmp/x -path '*/public/admin/index.html' | head -1); test -f \"$s/server.js\"; cp launcher.js /tmp/launcher.js; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com; git checkout -q --orphan site; git rm -rfq .; mkdir -p public-site backstage; cp -r \"$s\"/. public-site/; if [ -n \"$bi\" ]; then b=$(dirname \"$(dirname \"$(dirname \"$bi\")\")\"); cp -r \"$b\"/. backstage/; fi; cp /tmp/launcher.js .; git add -A; git commit -qm 'Site et Backstage extraits des zips'; git push -f origin site"}]}}}
